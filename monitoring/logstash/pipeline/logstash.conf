input {
  beats {
    port => 5044
  }
}

filter {
  # Traitement des logs Laravel
  if [fields][logtype] == "laravel" {
    grok {
      match => { 
        "message" => "\[%{TIMESTAMP_ISO8601:timestamp}\] %{DATA:environment}\.%{DATA:level}: %{GREEDYDATA:message}" 
      }
      overwrite => [ "message" ]
    }
    
    date {
      match => [ "timestamp", "yyyy-MM-dd HH:mm:ss" ]
    }
    
    if [level] == "ERROR" or [level] == "CRITICAL" {
      mutate {
        add_tag => [ "error" ]
      }
    }
  }
  
  # Traitement des logs Nginx
  if [fields][logtype] == "nginx-access" {
    grok {
      match => { 
        "message" => "%{NGINXACCESS}" 
      }
    }
    
    mutate {
      convert => { 
        "response" => "integer"
        "bytes" => "integer"
        "responsetime" => "float"
      }
    }
    
    if [response] >= 400 {
      mutate {
        add_tag => [ "error" ]
      }
    }
  }
  
  # Traitement des logs d'erreur Nginx
  if [fields][logtype] == "nginx-error" {
    grok {
      match => { 
        "message" => "%{NGINXERROR}" 
      }
    }
    
    mutate {
      add_tag => [ "error" ]
    }
  }
  
  # Enrichissement avec des métadonnées
  mutate {
    add_field => { 
      "[@metadata][index]" => "logstash-%{+YYYY.MM.dd}"
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "%{[@metadata][index]}"
  }
  
  # Debug output (optionnel)
  stdout { 
    codec => rubydebug 
  }
}